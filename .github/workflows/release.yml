name: Release GhostMouse

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Universal App & DMG
        run: |
          chmod +x build_app.sh release_dmg.sh
          ./release_dmg.sh

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GhostMouse.dmg
            GhostMouse.zip
          generate_release_notes: true
